<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/peak-brew.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peak Brew Trading</title>
    <meta name="description" content="Premium Nepalese craft beer collection and invoice management system" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Global util polyfill for Node.js compatibility
      if (!window.util) {
        window.util = {
          inherits: function(ctor, superCtor) {
            if (superCtor) {
              ctor.super_ = superCtor;
              ctor.prototype = Object.create(superCtor.prototype, {
                constructor: {
                  value: ctor,
                  enumerable: false,
                  writable: true,
                  configurable: true
                }
              });
            }
          },
          isArray: Array.isArray,
          isBuffer: function(obj) {
            return obj != null && obj.constructor != null &&
              typeof obj.constructor.isBuffer === 'function' && obj.constructor.isBuffer(obj);
          },
          isFunction: function(obj) { return typeof obj === 'function'; },
          isString: function(obj) { return typeof obj === 'string'; },
          isNumber: function(obj) { return typeof obj === 'number'; },
          isObject: function(obj) { return typeof obj === 'object' && obj !== null; },
          debuglog: function(section) {
            return function(msg) {
              if (typeof process !== 'undefined' && process.env && process.env.NODE_DEBUG && process.env.NODE_DEBUG.includes(section)) {
                console.log(section + ':', msg);
              }
            };
          },
          inspect: function(obj) {
            if (obj === null) return 'null';
            if (obj === undefined) return 'undefined';
            if (typeof obj === 'string') return "'" + obj + "'";
            if (typeof obj === 'number' || typeof obj === 'boolean') return String(obj);
            return JSON.stringify(obj);
          }
        };
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
